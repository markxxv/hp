name: Deploy Handpan Studio to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - '.nojekyll'
      - 'assets/app.js'
      - 'assets/app.css'
      - 'samples/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check and test
        run: npm run check && npm test
      - name: Build and verify production output
        run: |
          npm run build
          npm run verify
          touch dist/.nojekyll
      - name: Publish compatible assets for branch-based Pages
        run: |
          mkdir -p assets
          js_files=(dist/assets/main-*.js)
          css_files=(dist/assets/main-*.css)
          test -f "${js_files[0]}" && test -f "${css_files[0]}"
          cp "${js_files[0]}" assets/app.js
          cp "${css_files[0]}" assets/app.css
          test -s assets/app.js && test -s assets/app.css
      - name: Commit compiled site for branch-based Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/ assets/app.js assets/app.css
          if ! git diff --cached --quiet; then
            git commit -m "Build static Vite site for GitHub Pages [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
